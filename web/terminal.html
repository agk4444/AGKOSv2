<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGKOS v0.1 — browser terminal</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; background: #0b0e14; color: #d6deeb;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid #1e2530;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #status { font-size: 12px; color: #7f8ba0; }
  #bootBtn {
    font: inherit; font-size: 13px; cursor: pointer;
    background: #1d7a3a; color: #fff; border: none; border-radius: 6px;
    padding: 7px 16px;
  }
  #bootBtn:disabled { background: #334155; cursor: default; }
  #term {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    white-space: pre-wrap; word-break: break-word;
    font-size: 14px; line-height: 1.45; background: #0b0e14;
  }
  #inputRow {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-top: 1px solid #1e2530; background: #0d1119;
  }
  #promptLabel { color: #4ec9b0; font-weight: 600; font-size: 14px; }
  #cmd {
    flex: 1; font: inherit; font-size: 14px;
    background: #11161f; color: #d6deeb;
    border: 1px solid #2a3342; border-radius: 6px; padding: 8px 10px;
  }
  #cmd:focus { outline: none; border-color: #4ec9b0; }
  #runBtn {
    font: inherit; font-size: 13px; cursor: pointer;
    background: #2563eb; color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px;
  }
  .err { color: #f87171; }
</style>
</head>
<body>
<header>
  <h1>AGKOS v0.1 — browser terminal</h1>
  <button id="bootBtn">Boot</button>
  <span id="status">press Boot to start</span>
</header>
<div id="term" aria-live="polite"></div>
<div id="inputRow">
  <span id="promptLabel">agk&gt;</span>
  <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="type a command, press Enter" disabled>
  <button id="runBtn">Run</button>
</div>

d.split(\"/\")\n    stack = list()\n    for comp in parts:\n        if comp == \"..\":\n            if len(stack) > 0:\n                stack.pop()\n        elif comp != \"\" and comp != \".\":\n            stack.append(comp)\n    if len(stack) == 0:\n        return \"/\"\n    return \"/\" + \"/\".join(stack)\n\nclass FsNode:\n    def __init__(self, n, d):\n        self.name = n\n        self.is_dir = d\n        self.content = \"\"\n        ch = list()\n        self.children = ch\n    def child_index(self, n):\n        for i in range(0, (len(self.children) - 1) + 1):\n            c = self.children[i]\n            if c.name == n:\n                return i\n        return -1\n    def add_child(self, child):\n        self.children.append(child)\n    def set_content(self, t):\n        self.content = t\n    def remove_child(self, idx):\n        kept = list()\n        for i in range(0, (len(self.children) - 1) + 1):\n            if i != idx:\n                kept.append(self.children[i])\n        self.children = kept\n\nclass FileSystem:\n    def __init__(self):\n        r = FsNode(\"/\", True)\n        self.root = r\n    def locate(self, path):\n        parts = path.split(\"/\")\n        node = self.root\n        for i in range(1, (len(parts) - 1) + 1):\n            part = parts[i]\n            if part != \"\":\n                idx = node.child_index(part)\n                if idx < 0:\n                    raise Exception(\"no such file or directory: {}\".format(path))\n                node = node.children[idx]\n        return node\n    def exists(self, path):\n        try:\n            self.locate(path)\n            return True\n        except Exception:\n            return False\n    def mkdir(self, path):\n        parent = parent_of(path)\n        node = self.locate(parent)\n        if node.is_dir == False:\n            raise Exception(\"not a directory: {}\".format(parent))\n        name = base_of(path)\n        if node.child_index(name) >= 0:\n            raise Exception(\"already exists: {}\".format(path))\n        nd = FsNode(name, True)\n        node.add_child(nd)\n    def write_file(self, path, content):\n        parent = parent_of(path)\n        node = self.locate(parent)\n        if node.is_dir == False:\n            raise Exception(\"not a directory: {}\".format(parent))\n        name = base_of(path)\n        idx = node.child_index(name)\n        if idx >= 0:\n            target = node.children[idx]\n            if target.is_dir:\n                raise Exception(\"is a directory: {}\".format(path))\n            target.set_content(content)\n        else:\n            f = FsNode(name, False)\n            f.set_content(content)\n            node.add_child(f)\n    def read_file(self, path):\n        node = self.locate(path)\n        if node.is_dir:\n            raise Exception(\"is a directory: {}\".format(path))\n        return node.content\n    def list_dir(self, path):\n        node = self.locate(path)\n        if node.is_dir == False:\n            raise Exception(\"not a directory: {}\".format(path))\n        names = list()\n        for c in node.children:\n            if c.is_dir:\n                names.append(c.name + \"/\")\n            else:\n                names.append(c.name)\n        return names\n    def save(self, path):\n        data = node_to_dict(self.root)\n        text = json.dumps(data)\n        f = open(path, \"w\")\n        f.write(text)\n        f.close()\n        return True\n    def remove(self, path):\n        parent = parent_of(path)\n        node = self.locate(parent)\n        name = base_of(path)\n        idx = node.child_index(name)\n        if idx < 0:\n            raise Exception(\"no such file or directory: {}\".format(path))\n        node.remove_child(idx)\n    def copy(self, src, dst):\n        text = self.read_file(src)\n        self.write_file(dst, text)\n        return True\n    def move(self, src, dst):\n        self.copy(src, dst)\n        self.remove(src)\n        return True\n    def ys_fetch(self, url):\n        return self.netsim.fetch(url)\n    def sys_lookup(self, name):\n        procs = self.sched.all()\n        for p in procs:\n            nm = p.name\n            if nm == name:\n                return p.pid\n        return -1\n    def sys_write_file(self, path, content):\n        self.filesystem.write_file(path, content)\n    def sys_read_file(self, path):\n        return self.filesystem.read_file(path)\n    def spawn(self, name, prog, priority):\n        addr = self.mem.allocate(16)\n        if addr < 0:\n            print(\"kernel: out of memory, cannot spawn '{}'\".format(name))\n            return -1\n        pid = self.sched.spawn(name, prog, addr, priority)\n        print(\"kernel: spawned '{}' as pid {} (mem @{})\".format(name, pid, addr))\n        return pid\n    def cycle(self):\n        done = self.sched.cycle(self.ticks, self)\n        for p in done:\n            self.mem.release(p.mem_addr)\n            print(\"kernel: pid {} ('{}') exited, freed mem @{}\".format(p.pid, p.name, p.mem_addr))\n        self.sched.sweep()\n        self.ticks = self.ticks + 1\n\nclass CounterProg:\n    def __init__(self, kernel, t):\n        self.n = 0\n        self.target = t\n        self.k = kernel\n    def tick(self):\n        self.n = self.n + 1\n        self.k.sys_print(\"counter: {}/{}\".format(self.n, self.target))\n        return self.n < self.target\n\nclass ClockProg:\n    def __init__(self, kernel, t):\n        self.n = 0\n        self.target = t\n        self.k = kernel\n    def tick(self):\n        self.n = self.n + 1\n        t = self.k.sys_uptime()\n        self.k.sys_print(\"clock tick {} (uptime {})\".format(self.n, t))\n        return self.n < self.target\n\nclass WriterProg:\n    def __init__(self, kernel, p, t):\n        self.n = 0\n        self.target = t\n        self.k = kernel\n        self.path = p\n    def tick(self):\n        self.n = self.n + 1\n        self.k.sys_write_file(self.path, \"log line {}\".format(self.n))\n        self.k.sys_print(\"writer: wrote line {} to {}\".format(self.n, self.path))\n        return self.n < self.target\n\nclass SleeperProg:\n    def __init__(self, kernel, r):\n        self.k = kernel\n        self.rounds = r\n        self.n = 0\n    def tick(self):\n        self.n = self.n + 1\n        self.k.sys_print(\"sleeper: hello {}\".format(self.n))\n        self.k.sys_sleep(3)\n        self.rounds = self.rounds - 1\n        return self.rounds > 0\n\nclass EchoerProg:\n    def __init__(self, kernel):\n        self.k = kernel\n    def tick(self):\n        msg = self.k.sys_recv()\n        if msg != \"\":\n            self.k.sys_print(\"echoer got: {}\".format(msg))\n        return True\n\nclass TalkerProg:\n    def __init__(self, kernel, tname, c):\n        self.k = kernel\n        self.target_name = tname\n        self.count = c\n        self.n = 0\n    def tick(self):\n        self.n = self.n + 1\n        pid = self.k.sys_lookup(self.target_name)\n        if pid >= 0:\n            self.k.sys_print(\"talker: ping {} -> {}\".format(self.n, self.target_name))\n            self.k.sys_send(pid, \"ping {} from talker\".format(self.n))\n        else:\n            self.k.sys_print(\"talker: {} not found\".format(self.target_name))\n        return self.n < self.count\n\nclass NetProg:\n    def __init__(self, kernel, tgt, c):\n        self.k = kernel\n        self.target = tgt\n        self.count = c\n        self.n = 0\n    def tick(self):\n        self.n = self.n + 1\n        r = \"\"\n        try:\n            r = self.k.sys_ping(self.target)\n            self.k.sys_print(\"netprobe: {}\".format(r))\n        except Exception as e:\n            self.k.sys_print(\"netprobe: {}\".format(e))\n        return self.n < self.count\n\ndef join_from(parts, start):\n    words = list()\n    for i in range(start, (len(parts) - 1) + 1):\n        words.append(parts[i])\n    return \" \".join(words)\n\nclass Shell:\n    def __init__(self, kernel):\n        self.k = kernel\n        self.running = True\n        self.cwd = \"/\"\n    def cmd_help(self):\n        print(\"commands:\")\n        print(\"  ps                 list processes\")\n        print(\"  top                show process table (pid/name/state/pri/cpu)\")\n        print(\"  run <prog> [n] [prio]  spawn counter | clock | writer | sleeper | netprobe (n ticks default 5, prio default 5)\")\n        print(\"  run echoer [prio]  spawn a message echoer (prints anything sent to it)\")\n        print(\"  run talker [n] [name] [prio]  send n pings to process 'name' (default echoer)\")\n        print(\"  send <pid> <msg>   send a message to a process inbox\")\n        print(\"  kill <pid>         terminate a process\")\n        print(\"  tick [n]           advance the scheduler n cycles (default 5)\")\n        print(\"  mem                show memory usage\")\n        print(\"  pwd                show current directory\")\n        print(\"  cd [path]          change directory (no arg = /)\")\n        print(\"  ls [path]          list a directory (default: cwd)\")\n        print(\"  cat <path>         print a file\")\n        print(\"  write <path> ...   write text to a file\")\n        print(\"  mkdir <path>       make a directory\")\n        print(\"  rm <path>          remove a file or directory\")\n        print(\"  cp <src> <dst>     copy a file\")\n        print(\"  mv <src> <dst>     move/rename a file\")\n        print(\"  run_script <path>  execute commands from a file\")\n        print(\"  save               persist filesystem to agkos-fs.json\")\n        print(\"  ping <host>        ping a virtual network host\")\n        print(\"  fetch <url>        fetch a page from the virtual web\")\n        print(\"  hosts              list virtual network hosts\")\n        print(\"  echo <text>        print text\")\n        print(\"  uptime             show kernel ticks\")\n        print(\"  shutdown           halt the system (persists filesystem)\")\n    def cmd_ps(self):\n        procs = self.k.sched.all()\n        if len(procs) == 0:\n            print(\"no processes running\")\n        else:\n            print(\"pid  name     mem\")\n            for p in procs:\n                pid = p.pid\n                nm = p.name\n                ma = p.mem_addr\n                print(\"{}  {}  @{}\".format(pid, nm, ma))\n    def cmd_top(self):\n        procs = self.k.sched.all()\n        t = self.k.sys_uptime()\n        if len(procs) == 0:\n            print(\"no processes running\")\n        else:\n            print(\"pid  name      state  pri  cpu\")\n            for p in procs:\n                st = p.status(t)\n                print(\"{}  {}  {}  {}  {}\".format(p.pid, p.name, st, p.priority, p.cpu_ticks))\n    def cmd_run(self, parts):\n        if len(parts) < 2:\n            print(\"usage: run counter|clock|writer|sleeper|netprobe [n] [prio]\")\n        else:\n            prog = parts[1]\n            n = 5\n            if len(parts) >= 3:\n                n = int(parts[2])\n            prio = 5\n            if prog == \"talker\":\n                if len(parts) >= 5:\n                    prio = int(parts[4])\n            elif len(parts) >= 4:\n                prio = int(parts[3])\n            if prog == \"counter\":\n                c = CounterProg(self.k, n)\n                self.k.spawn(\"counter\", c, prio)\n            elif prog == \"clock\":\n                cl = ClockProg(self.k, n)\n                self.k.spawn(\"clock\", cl, prio)\n            elif prog == \"writer\":\n                w = WriterProg(self.k, \"/writer.log\", n)\n                self.k.spawn(\"writer\", w, prio)\n            elif prog == \"sleeper\":\n                s = SleeperProg(self.k, n)\n                self.k.spawn(\"sleeper\", s, prio)\n            elif prog == \"echoer\":\n                e = EchoerProg(self.k)\n                self.k.spawn(\"echoer\", e, prio)\n            elif prog == \"talker\":\n                tname = \"echoer\"\n                if len(parts) >= 4 \"mkdir: {}\".format(e))\n    def cmd_pwd(self):\n        print(self.cwd)\n    def cmd_cd(self, parts):\n        target = \"/\"\n        if len(parts) >= 2:\n            target = abspath(parts[1], self.cwd)\n        try:\n            self.k.filesystem.list_dir(target)\n            self.cwd = target\n        except Exception as e:\n            print(\"cd: {}\".format(e))\n    def cmd_rm(self, parts):\n        if len(parts) < 2:\n            print(\"usage: rm <path>\")\n        else:\n            ap = abspath(parts[1], self.cwd)\n            try:\n                self.k.filesystem.remove(ap)\n                print(\"removed {}\".format(ap))\n            except Exception as e:\n                print(\"rm: {}\".format(e))\n    def cmd_cp(self, parts):\n        if len(parts) < 3:\n            print(\"usage: cp <src> <dst>\")\n        else:\n            src = abspath(parts[1], self.cwd)\n            dst = abspath(parts[2], self.cwd)\n            try:\n                self.k.filesystem.copy(src, dst)\n                print(\"copied {} to {}\".format(src, dst))\n            except Exception as e:\n                print(\"cp: {}\".format(e))\n    def cmd_mv(self, parts):\n        if len(parts) < 3:\n            print(\"usage: mv <src> <dst>\")\n        else:\n            src = abspath(parts[1], self.cwd)\n            dst = abspath(parts[2], self.cwd)\n            try:\n                self.k.filesystem.move(src, dst)\n                print(\"moved {} to {}\".format(src, dst))\n            except Exception as e:\n                print(\"mv: {}\".format(e))\n    def cmd_run_script(self, parts):\n        if len(parts) < 2:\n            print(\"usage: run_script <path>\")\n        else:\n            ap = abspath(parts[1], self.cwd)\n            text = \"\"\n            ok = True\n            try:\n                text = self.k.filesystem.read_file(ap)\n            except Exception as e:\n                print(\"run_script: {}\".format(e))\n                ok = False\n            if ok:\n                lines = text.split(\"\\n\")\n                for line in lines:\n                    comment = False\n                    if len(line) > 0:\n                        if line[0] == \"#\":\n                            comment = True\n                    if line != \"\" and comment == False:\n                        self.dispatch(line)\n    def cmd_save(self):\n        try:\n            self.k.filesystem.save(\"agkos-fs.json\")\n            print(\"filesystem saved\")\n        except Exception as e:\n            print(\"save: {}\".format(e))\n    def dispatch(self, line):\n        parts = line.split(\" \")\n        if len(parts) == 0:\n            print(\"\")\n        elif parts[0] == \"\":\n            print(\"\")\n        elif parts[0] == \"help\":\n            self.cmd_help()\n        elif parts[0] == \"ps\":\n            self.cmd_ps()\n        elif parts[0] == \"top\":\n            self.cmd_top()\n        elif parts[0] == \"run\":\n            self.cmd_run(parts)\n        elif parts[0] == \"send\":\n            self.cmd_send(parts)\n        elif parts[0] == \"kill\":\n            self.cmd_kill(parts)\n        elif parts[0] == \"tick\":\n            self.cmd_tick(parts)\n        elif parts[0] == \"mem\":\n            self.cmd_mem()\n        elif parts[0] == \"ping\":\n            self.cmd_ping(parts)\n        elif parts[0] == \"fetch\":\n            self.cmd_fetch(parts)\n        elif parts[0] == \"hosts\":\n            self.cmd_hosts()\n        elif parts[0] == \"pwd\":\n            self.cmd_pwd()\n        elif parts[0] == \"cd\":\n            self.cmd_cd(parts)\n        elif parts[0] == \"ls\":\n            self.cmd_ls(parts)\n        elif parts[0] == \"cat\":\n            self.cmd_cat(parts)\n        elif parts[0] == \"write\":\n            self.cmd_write(parts)\n        elif parts[0] == \"mkdir\":\n            self.cmd_mkdir(parts)\n        elif parts[0] == \"rm\":\n            self.cmd_rm(parts)\n        elif parts[0] == \"cp\":\n            self.cmd_cp(parts)\n        elif parts[0] == \"mv\":\n            self.cmd_mv(parts)\n        elif parts[0] == \"run_script\":\n            self.cmd_run_script(parts)\n        elif parts[0] == \"save\":\n            self.cmd_save()\n        elif parts[0] == \"echo\":\n            print(join_from(parts, 1))\n        elif parts[0] == \"uptime\":\n            t = self.k.sys_uptime()\n            print(\"uptime: {} ticks\".format(t))\n        elif parts[0] == \"shutdown\":\n            self.running = False\n        else:\n            print(\"unknown command: {} (try 'help')\".format(parts[0]))\n    def run(self):\n        print(\"AGKOS shell \u2014 type 'help'\")\n        while self.running:\n            line = \"\"\n            ok = True\n            try:\n                line = input(\"{} $ \".format(self.cwd))\n            except Exception:\n                print(\"\")\n                ok = False\n                self.running = False\n            if ok:\n                self.dispatch(line)\n                self.k.cycle()\n        try:\n            self.k.filesystem.save(\"agkos-fs.json\")\n        except Exception as e:\n            silent = e\n\ndef main():\n    print(\"AGKOS v0.1 \u2014 simulated OS on AGK-Real\")\n    print(\"boot: probing memory...\")\n    k = Kernel()\n    print(\"boot: mounted /dev/mem0 (256 blocks)\")\n    try:\n        k.filesystem.load(\"agkos-fs.json\")\n        print(\"boot: restored filesystem from agkos-fs.json\")\n    except Exception as e:\n        k.filesystem.mkdir(\"/home\")\n        k.filesystem.mkdir(\"/bin\")\n        k.filesystem.write_file(\"/readme.txt\", \"Welcome to AGKOS. Type 'help'.\")\n        k.filesystem.write_file(\"/home/notes.txt\", \"AGK is all you need.\")\n        print(\"boot: fresh filesystem\")\n        print(\"boot: filesystem ready (/readme.txt, /home/notes.txt)\")\n    print(\"boot: init complete\")\n    print(\"\")\n    sh = Shell(k)\n    sh.run()\n    print(\"AGKOS halted. bye.\")\n\nif __name__ == \ const termEl   = document.getElementById('term');
const cmdInput = document.getElementById('cmd');
const bootBtn  = document.getElementById('bootBtn');
const runBtn   = document.getElementById('runBtn');
const statusEl = document.getElementById('status');

function setStatus(s) { statusEl.textContent = s; }

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function termWrite(s) {
  const span = document.createElement('span');
  span.innerHTML = escHtml(String(s)).replace(/\n/g, '<br>');
  termEl.appendChild(span);
  termEl.scrollTop = termEl.scrollHeight;
}
function termError(s) {
  const span = document.createElement('span');
  span.className = 'err';
  span.innerHTML = escHtml(String(s)).replace(/\n/g, '<br>');
  termEl.appendChild(span);
  termEl.scrollTop = termEl.scrollHeight;
}

/* Promise queue bridging Python's input() to the on-page command box.
   Each __ainput() call pushes one resolver; Enter resolves the oldest. */
const _waiters = [];
function waitForLine() {
  return new Promise((resolve) => {
    _waiters.push(resolve);
    cmdInput.disabled = false;   /* first prompt has arrived: enable input */
    cmdInput.focus();
  });
}
/* Expose to Pyodide's `js` module so Python can call js.termWrite / js.waitForLine */
globalThis.termWrite = termWrite;
globalThis.waitForLine = waitForLine;

function submitLine() {
  if (_waiters.length === 0) return;   /* no prompt pending: ignore */
  const val = cmdInput.value;
  cmdInput.value = '';
  termWrite(val + '\n');               /* echo the typed line */
  _waiters.shift()(val);
}
cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitLine(); }
});
runBtn.addEventListener('click', () => { cmdInput.focus(); submitLine(); });

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('script load failed: ' + src));
    document.head.appendChild(s);
  });
}
async function loadPyodideWithFallback() {
  const urls = [
    'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js',
    'https://unpkg.com/pyodide@0.26.4/full/pyodide.js'
  ];
  let lastErr = null;
  for (const u of urls) {
    try {
      await loadScript(u);
      if (typeof loadPyodide !== 'function') throw new Error('loadPyodide missing');
      return await loadPyodide();
    } catch (e) { lastErr = e; }
  }
  throw new Error('Could not load Pyodide 0.26.4 from any CDN (' + lastErr + ')');
}

/* Build the async driver from the embedded bundle:
   rewrite blocking input() into awaited _ainput(), make the shell loop
   and main() async, await the shell, drop the __main__ runner block.
   (Single-underscore helper: a __dunder name inside class Shell would be
   name-mangled to _Shell__... and NameError at runtime.) */
function buildDriver() {
  const driver = BUNDLE_SRC
    .replace(/\binput\(/g, 'await _ainput(')
    .replace(/def run\(self\):/g, 'async def run(self):')
    .replace(/def main\(\):/g, 'async def main():')
    .replace(/sh\.run\(\)/g, 'await sh.run()')
    .replace(/if __name__ == "__main__":[\s\S]*$/, '');
  const preamble =
    'import asyncio, js\n' +
    '_input_waiters = []\n' +
    'async def _ainput(prompt=""):\n' +
    '    js.termWrite(str(prompt))\n' +
    '    line = await js.waitForLine()\n' +
    '    return str(line)\n';
  return preamble + driver + '\nawait main()\n';
}

let booted = false;
bootBtn.addEventListener('click', async () => {
  if (booted) return;
  booted = true;
  bootBtn.disabled = true;
  if (!BUNDLE_SRC) {
    setStatus('ERROR: no OS bundle embedded');
    termError('ERROR: terminal.html was built without the AGKOS bundle.\n');
    return;
  }
  setStatus('loading Pyodide\u2026');
  let pyodide;
  try {
    pyodide = await loadPyodideWithFallback();
  } catch (e) {
    setStatus('ERROR: Pyodide failed to load');
    termError('ERROR: ' + e.message + '\n');
    booted = false;
    bootBtn.disabled = false;
    return;
  }
  pyodide.setStdout({ batched: (s) => termWrite(s) });
  pyodide.setStderr({ batched: (s) => termWrite(s) });
  setStatus('booting AGKOS\u2026');
  try {
    await pyodide.runPythonAsync(buildDriver());
    setStatus('halted');
    cmdInput.disabled = true;
  } catch (e) {
    termError('\n[python error] ' + (e && e.message ? e.message : e) + '\n');
    setStatus('error');
  }
});
